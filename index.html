<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TeslaMirror</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── CONNECT SCREEN ── */
    #connect-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    #connect-screen h1 {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 3px;
    }
    .subtitle { font-size: 14px; color: #555; }

    #room-input {
      font-size: 38px;
      text-align: center;
      letter-spacing: 12px;
      text-transform: uppercase;
      width: 280px;
      padding: 16px 20px;
      background: #1a1a1a;
      border: 2px solid #2a2a2a;
      border-radius: 16px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    #room-input:focus { border-color: #e31937; }

    #connect-btn {
      padding: 16px 52px;
      font-size: 18px;
      font-weight: 600;
      background: #e31937;
      border: none;
      border-radius: 16px;
      color: #fff;
      cursor: pointer;
    }
    #connect-btn:active { background: #a0112a; }
    #status { font-size: 14px; color: #555; min-height: 20px; }

    /* ── LAUNCHER SCREEN ── */
    #launcher-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    /* Top bar */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    #top-bar-brand {
      font-size: 14px;
      font-weight: 700;
      color: #e31937;
      letter-spacing: 2px;
    }
    #top-clock {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 2px;
    }
    #top-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #4caf50;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }

    /* Grid */
    #launcher-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: #161616;
      border-radius: 18px;
      border: 1px solid #222;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    /* Music card — full left column */
    #music-card {
      grid-column: 1;
      grid-row: 1 / 3;
      justify-content: space-between;
    }
    #music-art-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      margin-bottom: 12px;
    }
    #music-art-placeholder {
      width: 130px; height: 130px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e1e1e, #2a1a2e, #1a1a3a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    #music-art-img {
      width: 130px; height: 130px;
      border-radius: 14px;
      object-fit: cover;
      display: none;
    }
    #music-info { text-align: center; margin-bottom: 14px; flex-shrink: 0; }
    #music-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #music-artist { font-size: 12px; color: #555; margin-top: 3px; }

    #music-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .media-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 26px;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 12px;
      line-height: 1;
    }
    .media-btn:active { background: #2a2a2a; }
    .media-btn.play {
      font-size: 32px;
      color: #fff;
      background: #e31937;
      padding: 12px 18px;
      margin: 0 6px;
      border-radius: 14px;
    }
    .media-btn.play:active { background: #a0112a; }

    /* Nav card */
    #nav-card { grid-column: 2; grid-row: 1; }
    #nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex: 1;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 8px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .nav-btn:active { background: #2a2a2a; }
    .nav-btn .nav-icon { font-size: 26px; line-height: 1; }

    /* Apps card */
    #apps-card { grid-column: 2; grid-row: 2; }
    #apps-grid {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      -webkit-overflow-scrolling: touch;
      min-height: 0;
    }
    #apps-grid::-webkit-scrollbar { display: none; }

    .app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 4px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #bbb;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      overflow: hidden;
    }
    .app-btn:active { background: #2a2a2a; }
    .app-btn img {
      width: 30px; height: 30px;
      border-radius: 7px;
    }
    .app-btn .app-emoji { font-size: 22px; line-height: 1; }
    .app-btn span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }
    .apps-loading {
      grid-column: 1 / -1;
      color: #444;
      font-size: 12px;
      text-align: center;
      padding: 20px 0;
    }

    /* Bottom bar */
    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      height: 58px;
      background: #111;
      border-top: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .slider-icon { font-size: 14px; color: #555; flex-shrink: 0; }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #2a2a2a;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #e31937;
      cursor: pointer;
    }
    #mirror-btn {
      padding: 0 22px;
      height: 38px;
      background: #e31937;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    #mirror-btn:active { background: #a0112a; }

    /* ── MIRROR SCREEN ── */
    #mirror-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
    }

    /* Rotation overlay */
    #rotation-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 50;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 16px;
      color: #888;
    }
    #rotation-overlay .spin { font-size: 36px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #mirror-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #touch-overlay {
      position: fixed;
      inset: 0;
      touch-action: none;
      cursor: crosshair;
      z-index: 10;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .hud-pill {
      padding: 5px 14px;
      border-radius: 20px;
      background: rgba(0,0,0,0.65);
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      pointer-events: all;
    }
    #fps-label { pointer-events: none; }
    #back-btn, #disconnect-btn { cursor: pointer; }
    #disconnect-btn { color: #e31937; }

    .ripple {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      animation: ripple-out 0.4s ease-out forwards;
      z-index: 30;
    }
    @keyframes ripple-out {
      from { width: 0; height: 0; opacity: 1; margin: 0; }
      to   { width: 60px; height: 60px; opacity: 0; margin: -30px; }
    }
  </style>
</head>
<body ontouchstart="">

<!-- ── CONNECT SCREEN ── -->
<div id="connect-screen">
  <h1>TeslaMirror</h1>
  <p class="subtitle">Enter the room code shown on your phone</p>
  <input id="room-input" type="text" maxlength="6" placeholder="ABC123"
         autocomplete="off" spellcheck="false" autocapitalize="characters">
  <button id="connect-btn" onclick="connect()">Connect</button>
  <p id="status"></p>
</div>

<!-- ── LAUNCHER SCREEN ── -->
<div id="launcher-screen">

  <div id="top-bar">
    <div id="top-bar-brand">TESLAMIRROR</div>
    <div id="top-clock">--:--</div>
    <div id="top-bar-right">
      <div class="status-dot"></div>
      Connected
    </div>
  </div>

  <div id="launcher-grid">

    <!-- Music -->
    <div class="card" id="music-card">
      <div class="card-label">Now Playing</div>
      <div id="music-art-wrap">
        <div id="music-art-placeholder">🎵</div>
        <img id="music-art-img" alt="Album art">
      </div>
      <div id="music-info">
        <div id="music-title">Music</div>
        <div id="music-artist">Play something on your phone</div>
      </div>
      <div id="music-controls">
        <button class="media-btn" onclick="send({type:'media_prev'})">⏮</button>
        <button class="media-btn play" id="play-btn" onclick="togglePlay()">⏵</button>
        <button class="media-btn" onclick="send({type:'media_next'})">⏭</button>
      </div>
    </div>

    <!-- Navigation -->
    <div class="card" id="nav-card">
      <div class="card-label">Navigation</div>
      <div id="nav-buttons">
        <button class="nav-btn" onclick="send({type:'launch_app',package:'com.waze'})">
          <span class="nav-icon">🗺️</span>Waze
        </button>
        <button class="nav-btn" onclick="send({type:'launch_app',package:'com.google.android.apps.maps'})">
          <span class="nav-icon">📍</span>Maps
        </button>
      </div>
    </div>

    <!-- All Apps -->
    <div class="card" id="apps-card">
      <div class="card-label">Apps</div>
      <div id="apps-grid">
        <div class="apps-loading">Loading apps…</div>
      </div>
    </div>

  </div>

  <div id="bottom-bar">
    <div class="slider-group">
      <span class="slider-icon">🔈</span>
      <input type="range" id="vol-slider" min="0" max="100" value="50"
             oninput="send({type:'set_volume',value:this.value/100})">
      <span class="slider-icon">🔊</span>
    </div>
    <div class="slider-group">
      <span class="slider-icon">🌑</span>
      <input type="range" id="bright-slider" min="0" max="100" value="80"
             oninput="send({type:'set_brightness',value:this.value/100})">
      <span class="slider-icon">☀️</span>
    </div>
    <button id="mirror-btn" onclick="showMirror()">📲 Mirror</button>
  </div>

</div>

<!-- ── MIRROR SCREEN ── -->
<div id="mirror-screen">
  <canvas id="mirror-canvas"></canvas>
  <div id="touch-overlay"></div>
  <div id="rotation-overlay">
    <div class="spin">🔄</div>
    Rotating…
  </div>
  <div id="hud">
    <span class="hud-pill" id="fps-label">-- fps</span>
    <span class="hud-pill" id="back-btn" onclick="showLauncher()">← Launcher</span>
    <span class="hud-pill" id="disconnect-btn" onclick="disconnect()">✕ Disconnect</span>
  </div>
</div>

<script>
  const SERVER_WS = location.origin.replace(/^http/, 'ws');

  const canvas   = document.getElementById('mirror-canvas');
  const ctx      = canvas.getContext('2d');
  const overlay  = document.getElementById('touch-overlay');
  const fpsLabel = document.getElementById('fps-label');
  const statusEl = document.getElementById('status');
  const rotOvl   = document.getElementById('rotation-overlay');

  let ws         = null;
  let frameCount = 0;
  let playing    = false;

  // ── Sequential frame processing ──────────────────────────────────────────
  // Only one createImageBitmap at a time. If frames arrive while decoding,
  // keep only the latest — prevents race conditions on rotation.
  let decoding  = false;
  let nextBlob  = null;

  function scheduleFrame(blob) {
    nextBlob = blob;
    if (!decoding) decodeNext();
  }

  async function decodeNext() {
    if (!nextBlob) { decoding = false; return; }
    decoding = true;
    const blob = nextBlob;
    nextBlob = null;

    try {
      const bmp = await createImageBitmap(blob);
      if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
        canvas.width  = bmp.width;
        canvas.height = bmp.height;
        fitCanvas();
      }
      ctx.drawImage(bmp, 0, 0);
      bmp.close();
      frameCount++;
    } catch (e) {
      // Corrupt/partial frame (can happen mid-rotation) — skip silently
    }

    decodeNext(); // process next queued frame if any
  }
  // ─────────────────────────────────────────────────────────────────────────

  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('top-clock').textContent =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 10000);

  // FPS
  setInterval(() => { fpsLabel.textContent = frameCount + ' fps'; frameCount = 0; }, 1000);

  // Auto-fill room from ?room=
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const room = params.get('room');
    if (room) document.getElementById('room-input').value = room.toUpperCase();
  });

  function setStatus(msg, color = '#555') {
    statusEl.textContent = msg;
    statusEl.style.color = color;
  }

  // ── WebSocket ──
  function connect() {
    const roomCode = document.getElementById('room-input').value.trim().toUpperCase();
    if (roomCode.length < 4) { setStatus('Enter a valid room code', '#e31937'); return; }

    setStatus('Connecting…', '#888');
    ws = new WebSocket(SERVER_WS);
    ws.binaryType = 'blob';

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'join', room: roomCode, role: 'browser' }));
      setStatus('Waiting for phone…', '#f5a623');
    };

    ws.onmessage = (event) => {
      if (event.data instanceof Blob) {
        scheduleFrame(event.data);
        return;
      }

      const msg = JSON.parse(event.data);

      if (msg.type === 'peer_ready') {
        showLauncher();
        setupTouchHandlers();
        // Auto-load all apps
        send({ type: 'get_apps' });

      } else if (msg.type === 'peer_disconnected') {
        showConnect('Phone disconnected');

      } else if (msg.type === 'initial_state') {
        document.getElementById('vol-slider').value    = Math.round(msg.volume * 100);
        document.getElementById('bright-slider').value = Math.round(msg.brightness * 100);

      } else if (msg.type === 'volume_update') {
        document.getElementById('vol-slider').value = Math.round(msg.value * 100);

      } else if (msg.type === 'app_list') {
        renderApps(msg.apps);

      } else if (msg.type === 'media_info') {
        updateMediaInfo(msg);

      } else if (msg.type === 'stream_pause') {
        // Phone is rotating — freeze and show spinner
        rotOvl.style.display = 'flex';

      } else if (msg.type === 'stream_resume') {
        // New dimensions incoming — pre-size canvas, hide spinner
        if (msg.width && msg.height) {
          canvas.width  = msg.width;
          canvas.height = msg.height;
          fitCanvas();
        }
        rotOvl.style.display = 'none';
      }
    };

    ws.onclose = () => showConnect('Disconnected');
    ws.onerror = () => setStatus('Connection error', '#e31937');
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  function disconnect() { ws && ws.close(); }

  function togglePlay() {
    playing = !playing;
    document.getElementById('play-btn').textContent = playing ? '⏸' : '⏵';
    send({ type: 'media_play_pause' });
  }

  // ── Media info ──
  function updateMediaInfo(msg) {
    if (msg.title) document.getElementById('music-title').textContent  = msg.title;
    if (msg.artist !== undefined) document.getElementById('music-artist').textContent = msg.artist || '—';

    const img  = document.getElementById('music-art-img');
    const placeholder = document.getElementById('music-art-placeholder');
    if (msg.art) {
      img.src = 'data:image/jpeg;base64,' + msg.art;
      img.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      img.style.display = 'none';
      placeholder.style.display = 'flex';
    }
  }

  // ── Apps grid ──
  function renderApps(apps) {
    const grid = document.getElementById('apps-grid');
    grid.innerHTML = '';
    apps.forEach(app => {
      const btn = document.createElement('button');
      btn.className = 'app-btn';
      btn.innerHTML =
        '<img src="data:image/png;base64,' + app.icon + '" alt="">' +
        '<span>' + escHtml(app.name) + '</span>';
      btn.onclick = () => send({ type: 'launch_app', package: app.package });
      grid.appendChild(btn);
    });
    if (apps.length === 0) {
      grid.innerHTML = '<div class="apps-loading">No apps found</div>';
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Screen transitions ──
  function showConnect(msg) {
    document.getElementById('connect-screen').style.display  = 'flex';
    document.getElementById('launcher-screen').style.display = 'none';
    document.getElementById('mirror-screen').style.display   = 'none';
    if (msg) setStatus(msg, '#555');
  }

  function showLauncher() {
    document.getElementById('connect-screen').style.display  = 'none';
    document.getElementById('launcher-screen').style.display = 'flex';
    document.getElementById('mirror-screen').style.display   = 'none';
  }

  function showMirror() {
    document.getElementById('launcher-screen').style.display = 'none';
    document.getElementById('mirror-screen').style.display   = 'block';
    fitCanvas(); // ensure canvas is sized correctly when mirror screen opens
  }

  // ── Canvas fill ──
  function fitCanvas() {
    if (!canvas.width || !canvas.height) return;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const imgAspect    = canvas.width / canvas.height;
    const screenAspect = vw / vh;
    let displayW, displayH;
    if (imgAspect > screenAspect) {
      displayW = vw;
      displayH = vw / imgAspect;
    } else {
      displayH = vh;
      displayW = vh * imgAspect;
    }
    canvas.style.width  = displayW + 'px';
    canvas.style.height = displayH + 'px';
  }

  window.addEventListener('resize',            fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);

  // ── Touch / swipe on mirror ──
  function getCanvasCoords(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(1, (clientX - r.left) / r.width)),
      y: Math.max(0, Math.min(1, (clientY - r.top)  / r.height))
    };
  }

  function spawnRipple(clientX, clientY) {
    const el = document.createElement('div');
    el.className = 'ripple';
    el.style.left = clientX + 'px';
    el.style.top  = clientY + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function setupTouchHandlers() {
    let touchStartX, touchStartY;

    overlay.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      touchStartX = t.clientX; touchStartY = t.clientY;
    }, { passive: false });

    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const t    = e.changedTouches[0];
      const dist = Math.sqrt((t.clientX-touchStartX)**2 + (t.clientY-touchStartY)**2);

      if (dist < 12) {
        spawnRipple(t.clientX, t.clientY);
        const c = getCanvasCoords(t.clientX, t.clientY);
        ws.send(JSON.stringify({ type: 'touch', action: 'tap', x: c.x, y: c.y }));
      } else {
        const s   = getCanvasCoords(touchStartX, touchStartY);
        const end = getCanvasCoords(t.clientX, t.clientY);
        ws.send(JSON.stringify({ type: 'swipe', x1: s.x, y1: s.y, x2: end.x, y2: end.y }));
      }
    }, { passive: false });

    overlay.addEventListener('click', (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      spawnRipple(e.clientX, e.clientY);
      const c = getCanvasCoords(e.clientX, e.clientY);
      ws.send(JSON.stringify({ type: 'touch', action: 'tap', x: c.x, y: c.y }));
    });
  }
</script>
</body>
</html>

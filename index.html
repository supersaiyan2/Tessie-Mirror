<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TeslaMirror</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── CONNECT SCREEN ── */
    #connect-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    #connect-screen h1 {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 3px;
    }
    .subtitle { font-size: 14px; color: #666; }

    #room-input {
      font-size: 38px;
      text-align: center;
      letter-spacing: 12px;
      text-transform: uppercase;
      width: 280px;
      padding: 16px 20px;
      background: #1a1a1a;
      border: 2px solid #2a2a2a;
      border-radius: 16px;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    #room-input:focus { border-color: #e31937; }

    #connect-btn {
      padding: 16px 52px;
      font-size: 18px;
      font-weight: 600;
      background: #e31937;
      border: none;
      border-radius: 16px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    #connect-btn:active { background: #a0112a; }
    #status { font-size: 14px; color: #666; min-height: 20px; }

    /* ── LAUNCHER SCREEN ── */
    #launcher-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      background: #0a0a0a;
    }

    /* Top bar */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    #top-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #e31937;
      letter-spacing: 1px;
    }
    #top-bar-left span { font-size: 18px; }
    #top-clock {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #fff;
    }
    #top-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #4caf50;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }

    /* Main content grid */
    #launcher-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      flex: 1;
      min-height: 0;
    }

    /* Cards */
    .card {
      background: #161616;
      border-radius: 18px;
      border: 1px solid #222;
      padding: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 12px;
    }

    /* Music card — spans 2 rows on the left */
    #music-card {
      grid-column: 1;
      grid-row: 1 / 3;
      justify-content: space-between;
    }
    #music-art-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    #music-art {
      width: 100%;
      max-width: 160px;
      aspect-ratio: 1;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e1e1e 0%, #2a1a2a 50%, #1a1a2e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }
    #music-info { text-align: center; margin-bottom: 16px; }
    #music-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #music-artist { font-size: 13px; color: #666; margin-top: 3px; }

    #music-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .media-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 28px;
      cursor: pointer;
      padding: 10px 18px;
      border-radius: 12px;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .media-btn:active { background: #2a2a2a; color: #fff; }
    .media-btn.play {
      font-size: 36px;
      color: #fff;
      background: #e31937;
      padding: 12px 20px;
      margin: 0 8px;
    }
    .media-btn.play:active { background: #a0112a; }

    /* Navigation card */
    #nav-card {
      grid-column: 2;
      grid-row: 1;
    }
    #nav-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex: 1;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 10px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .nav-btn:active { background: #2a2a2a; }
    .nav-btn .nav-icon { font-size: 28px; line-height: 1; }
    .nav-btn.waze .nav-icon { font-size: 26px; }

    /* Apps card */
    #apps-card {
      grid-column: 2;
      grid-row: 2;
    }
    #quick-apps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
    }
    .app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 6px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #ccc;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      overflow: hidden;
    }
    .app-btn:active { background: #2a2a2a; }
    .app-btn .app-icon { font-size: 24px; line-height: 1; }
    .app-btn img.app-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 0;
    }
    .app-btn span.app-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }
    #all-apps-btn {
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #666;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s;
    }
    #all-apps-btn:active { background: #1e1e1e; }
    #all-apps-btn .app-icon { font-size: 20px; }

    /* All Apps overlay */
    #all-apps-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      padding: 20px;
    }
    #all-apps-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    #all-apps-header h2 { font-size: 18px; font-weight: 500; }
    #all-apps-close {
      background: #1e1e1e;
      border: none;
      color: #fff;
      font-size: 18px;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
    }
    #all-apps-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }
    .all-app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      color: #ccc;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .all-app-btn:active { background: #2a2a2a; }
    .all-app-btn img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }
    .all-app-btn span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }

    /* Bottom bar */
    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: #111;
      border-top: 1px solid #1e1e1e;
      flex-shrink: 0;
      height: 60px;
    }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .slider-icon { font-size: 16px; color: #666; flex-shrink: 0; }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #2a2a2a;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e31937;
      cursor: pointer;
    }
    #mirror-btn {
      padding: 0 24px;
      height: 40px;
      background: #e31937;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #mirror-btn:active { background: #a0112a; }

    /* ── MIRROR SCREEN ── */
    #mirror-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
    }
    #mirror-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #touch-overlay {
      position: fixed;
      inset: 0;
      touch-action: none;
      cursor: crosshair;
      z-index: 10;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .hud-pill {
      padding: 5px 14px;
      border-radius: 20px;
      background: rgba(0,0,0,0.65);
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      pointer-events: all;
    }
    #fps-label { pointer-events: none; }
    #back-btn { cursor: pointer; }
    #disconnect-btn { cursor: pointer; color: #e31937; }

    /* Touch ripple */
    .ripple {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      animation: ripple-out 0.4s ease-out forwards;
      z-index: 30;
    }
    @keyframes ripple-out {
      from { width: 0; height: 0; opacity: 1; margin: 0; }
      to   { width: 60px; height: 60px; opacity: 0; margin: -30px; }
    }
  </style>
</head>
<body ontouchstart="">

<!-- ── CONNECT SCREEN ── -->
<div id="connect-screen">
  <h1>TeslaMirror</h1>
  <p class="subtitle">Enter the room code shown on your phone</p>
  <input id="room-input" type="text" maxlength="6" placeholder="ABC123"
         autocomplete="off" spellcheck="false" autocapitalize="characters">
  <button id="connect-btn" onclick="connect()">Connect</button>
  <p id="status"></p>
</div>

<!-- ── LAUNCHER SCREEN ── -->
<div id="launcher-screen">

  <!-- Top bar -->
  <div id="top-bar">
    <div id="top-bar-left">
      <span>📱</span> TESLAMIRROR
    </div>
    <div id="top-clock">--:--</div>
    <div id="top-bar-right">
      <div class="status-dot"></div>
      Connected
    </div>
  </div>

  <!-- Cards grid -->
  <div id="launcher-grid">

    <!-- Music card -->
    <div class="card" id="music-card">
      <div class="card-label">Now Playing</div>
      <div id="music-art-wrap">
        <div id="music-art">🎵</div>
      </div>
      <div id="music-info">
        <div id="music-title">Music</div>
        <div id="music-artist">Use your phone to play something</div>
      </div>
      <div id="music-controls">
        <button class="media-btn" onclick="send({type:'media_prev'})" title="Previous">⏮</button>
        <button class="media-btn play" id="play-btn" onclick="togglePlay()" title="Play/Pause">⏵</button>
        <button class="media-btn" onclick="send({type:'media_next'})" title="Next">⏭</button>
      </div>
    </div>

    <!-- Navigation card -->
    <div class="card" id="nav-card">
      <div class="card-label">Navigation</div>
      <div id="nav-buttons">
        <button class="nav-btn waze" onclick="send({type:'launch_app',package:'com.waze'})">
          <span class="nav-icon">🗺️</span>
          Waze
        </button>
        <button class="nav-btn" onclick="send({type:'launch_app',package:'com.google.android.apps.maps'})">
          <span class="nav-icon">📍</span>
          Maps
        </button>
      </div>
    </div>

    <!-- Quick apps card -->
    <div class="card" id="apps-card">
      <div class="card-label">Apps</div>
      <div id="quick-apps">
        <button class="app-btn" onclick="send({type:'launch_app',package:'com.google.android.youtube'})">
          <span class="app-icon">▶️</span>
          <span class="app-name">YouTube</span>
        </button>
        <button class="app-btn" onclick="send({type:'launch_app',package:'com.whatsapp'})">
          <span class="app-icon">💬</span>
          <span class="app-name">WhatsApp</span>
        </button>
        <button class="app-btn" onclick="send({type:'launch_app',package:'com.spotify.music'})">
          <span class="app-icon">🎧</span>
          <span class="app-name">Spotify</span>
        </button>
        <button class="app-btn" onclick="send({type:'launch_app',package:'com.netflix.mediaclient'})">
          <span class="app-icon">🎬</span>
          <span class="app-name">Netflix</span>
        </button>
        <button id="all-apps-btn" onclick="openAllApps()">
          <span class="app-icon">⋯</span>
          All Apps
        </button>
      </div>
    </div>

  </div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <div class="slider-group">
      <span class="slider-icon">🔈</span>
      <input type="range" id="vol-slider" min="0" max="100" value="50"
             oninput="send({type:'set_volume',value:this.value/100})">
      <span class="slider-icon">🔊</span>
    </div>
    <div class="slider-group">
      <span class="slider-icon">🌑</span>
      <input type="range" id="bright-slider" min="0" max="100" value="80"
             oninput="send({type:'set_brightness',value:this.value/100})">
      <span class="slider-icon">☀️</span>
    </div>
    <button id="mirror-btn" onclick="showMirror()">
      <span>📲</span> Mirror Screen
    </button>
  </div>

</div>

<!-- ── ALL APPS OVERLAY ── -->
<div id="all-apps-overlay">
  <div id="all-apps-header">
    <h2>All Apps</h2>
    <button id="all-apps-close" onclick="closeAllApps()">✕ Close</button>
  </div>
  <div id="all-apps-grid"></div>
</div>

<!-- ── MIRROR SCREEN ── -->
<div id="mirror-screen">
  <canvas id="mirror-canvas"></canvas>
  <div id="touch-overlay"></div>
  <div id="hud">
    <span class="hud-pill" id="fps-label">-- fps</span>
    <span class="hud-pill" id="back-btn" onclick="showLauncher()">← Launcher</span>
    <span class="hud-pill" id="disconnect-btn" onclick="disconnect()">✕ Disconnect</span>
  </div>
</div>

<script>
  const SERVER_WS = location.origin.replace(/^http/, 'ws');

  const canvas    = document.getElementById('mirror-canvas');
  const ctx       = canvas.getContext('2d');
  const overlay   = document.getElementById('touch-overlay');
  const fpsLabel  = document.getElementById('fps-label');
  const statusEl  = document.getElementById('status');

  let ws          = null;
  let frameCount  = 0;
  let playing     = false;

  // Clock
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('top-clock').textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 10000);

  // FPS counter
  setInterval(() => {
    fpsLabel.textContent = frameCount + ' fps';
    frameCount = 0;
  }, 1000);

  // Auto-fill room code from ?room=
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const room = params.get('room');
    if (room) document.getElementById('room-input').value = room.toUpperCase();
  });

  function setStatus(msg, color = '#666') {
    statusEl.textContent = msg;
    statusEl.style.color = color;
  }

  // ── WebSocket ──
  function connect() {
    const roomCode = document.getElementById('room-input').value.trim().toUpperCase();
    if (roomCode.length < 4) { setStatus('Enter a valid room code', '#e31937'); return; }

    setStatus('Connecting...', '#888');
    ws = new WebSocket(SERVER_WS);
    ws.binaryType = 'blob';

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'join', room: roomCode, role: 'browser' }));
      setStatus('Waiting for phone...', '#f5a623');
    };

    ws.onmessage = async (event) => {
      if (event.data instanceof Blob) {
        let bmp;
        try {
          bmp = await createImageBitmap(event.data);
        } catch (e) {
          // Skip corrupt/partial frame (can happen during phone rotation)
          return;
        }
        if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
          canvas.width  = bmp.width;
          canvas.height = bmp.height;
          fitCanvas();
        }
        ctx.drawImage(bmp, 0, 0);
        bmp.close();
        frameCount++;
        return;
      }

      const msg = JSON.parse(event.data);

      if (msg.type === 'peer_ready') {
        showLauncher();
        setupTouchHandlers();

      } else if (msg.type === 'peer_disconnected') {
        showConnect('Phone disconnected');

      } else if (msg.type === 'initial_state') {
        document.getElementById('vol-slider').value    = Math.round(msg.volume * 100);
        document.getElementById('bright-slider').value = Math.round(msg.brightness * 100);

      } else if (msg.type === 'volume_update') {
        document.getElementById('vol-slider').value = Math.round(msg.value * 100);

      } else if (msg.type === 'app_list') {
        renderAllApps(msg.apps);
      }
    };

    ws.onclose = () => showConnect('Disconnected');
    ws.onerror = () => setStatus('Connection error', '#e31937');
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
    }
  }

  function disconnect() {
    ws && ws.close();
  }

  function togglePlay() {
    playing = !playing;
    document.getElementById('play-btn').textContent = playing ? '⏸' : '⏵';
    send({ type: 'media_play_pause' });
  }

  // ── Screen transitions ──
  function showConnect(msg) {
    document.getElementById('connect-screen').style.display  = 'flex';
    document.getElementById('launcher-screen').style.display = 'none';
    document.getElementById('mirror-screen').style.display   = 'none';
    if (msg) setStatus(msg, '#666');
  }

  function showLauncher() {
    document.getElementById('connect-screen').style.display  = 'none';
    document.getElementById('launcher-screen').style.display = 'flex';
    document.getElementById('mirror-screen').style.display   = 'none';
  }

  function showMirror() {
    document.getElementById('launcher-screen').style.display = 'none';
    document.getElementById('mirror-screen').style.display   = 'block';
  }

  // ── All Apps overlay ──
  function openAllApps() {
    document.getElementById('all-apps-overlay').style.display = 'flex';
    const grid = document.getElementById('all-apps-grid');
    if (grid.children.length === 0) {
      grid.innerHTML = '<div style="color:#444;grid-column:1/-1;text-align:center;padding:40px">Loading apps…</div>';
      send({ type: 'get_apps' });
    }
  }

  function closeAllApps() {
    document.getElementById('all-apps-overlay').style.display = 'none';
  }

  function renderAllApps(apps) {
    const grid = document.getElementById('all-apps-grid');
    grid.innerHTML = '';
    apps.forEach(app => {
      const btn = document.createElement('button');
      btn.className = 'all-app-btn';
      btn.innerHTML = `
        <img src="data:image/png;base64,${app.icon}" alt="">
        <span>${escHtml(app.name)}</span>
      `;
      btn.onclick = () => {
        send({ type: 'launch_app', package: app.package });
        closeAllApps();
      };
      grid.appendChild(btn);
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Canvas fill ──
  function fitCanvas() {
    if (!canvas.width || !canvas.height) return;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const imgAspect    = canvas.width / canvas.height;
    const screenAspect = vw / vh;
    let displayW, displayH;
    if (imgAspect > screenAspect) {
      displayW = vw;
      displayH = vw / imgAspect;
    } else {
      displayH = vh;
      displayW = vh * imgAspect;
    }
    canvas.style.width  = displayW + 'px';
    canvas.style.height = displayH + 'px';
  }

  window.addEventListener('resize',            fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);

  // ── Touch/swipe on mirror ──
  function getCanvasCoords(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(1, (clientX - r.left) / r.width)),
      y: Math.max(0, Math.min(1, (clientY - r.top)  / r.height))
    };
  }

  function spawnRipple(clientX, clientY) {
    const el = document.createElement('div');
    el.className = 'ripple';
    el.style.left = clientX + 'px';
    el.style.top  = clientY + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function setupTouchHandlers() {
    let touchStartX, touchStartY;

    overlay.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: false });

    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const t    = e.changedTouches[0];
      const dx   = t.clientX - touchStartX;
      const dy   = t.clientY - touchStartY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 12) {
        spawnRipple(t.clientX, t.clientY);
        const c = getCanvasCoords(t.clientX, t.clientY);
        ws.send(JSON.stringify({ type: 'touch', action: 'tap', x: c.x, y: c.y }));
      } else {
        const s   = getCanvasCoords(touchStartX, touchStartY);
        const end = getCanvasCoords(t.clientX, t.clientY);
        ws.send(JSON.stringify({ type: 'swipe', x1: s.x, y1: s.y, x2: end.x, y2: end.y }));
      }
    }, { passive: false });

    overlay.addEventListener('click', (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      spawnRipple(e.clientX, e.clientY);
      const c = getCanvasCoords(e.clientX, e.clientY);
      ws.send(JSON.stringify({ type: 'touch', action: 'tap', x: c.x, y: c.y }));
    });
  }
</script>
</body>

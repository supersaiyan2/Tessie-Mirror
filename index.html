<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TeslaMirror</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── CONNECT SCREEN ── */
    #connect-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    #connect-screen h1 { font-size: 32px; font-weight: 300; letter-spacing: 3px; }
    .subtitle { font-size: 14px; color: #555; }
    #room-input {
      font-size: 38px; text-align: center; letter-spacing: 12px;
      text-transform: uppercase; width: 280px; padding: 16px 20px;
      background: #1a1a1a; border: 2px solid #2a2a2a; border-radius: 16px;
      color: #fff; outline: none; transition: border-color 0.2s;
    }
    #room-input:focus { border-color: #e31937; }
    #connect-btn {
      padding: 16px 52px; font-size: 18px; font-weight: 600;
      background: #e31937; border: none; border-radius: 16px;
      color: #fff; cursor: pointer;
    }
    #connect-btn:active { background: #a0112a; }
    #status { font-size: 14px; color: #555; min-height: 20px; }

    /* ── LAUNCHER ── */
    #launcher-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    /* Top bar */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 50px;
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    #top-bar-brand { font-size: 13px; font-weight: 800; color: #e31937; letter-spacing: 2px; }
    #top-clock { font-size: 22px; font-weight: 300; letter-spacing: 2px; }
    #top-bar-right { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4caf50; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf50; }

    /* Grid — 3 equal columns */
    #launcher-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      grid-template-rows: 1fr;
      gap: 10px;
      padding: 10px;
      flex: 1;
      min-height: 0;
    }

    /* Left column — music only */
    #left-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    /* Right column */
    #right-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }

    /* Card base */
    .card {
      background: #161616;
      border-radius: 16px;
      border: 1px solid #1e1e1e;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    /* ── MUSIC CARD ── */
    #music-card { flex: 1; }

    #music-body {
      display: flex;
      gap: 16px;
      align-items: center;
      flex: 1;
      min-height: 0;
    }

    #music-art-wrap { flex-shrink: 0; }
    #music-art-placeholder {
      width: 110px; height: 110px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e1e1e, #2a1a2e, #1a1a3a);
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
    }
    #music-art-img {
      width: 110px; height: 110px;
      border-radius: 12px;
      object-fit: cover;
      display: none;
    }

    #music-text { flex: 1; min-width: 0; }
    #music-title {
      font-size: 16px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    #music-artist { font-size: 13px; color: #555; }

    #music-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      flex-shrink: 0;
    }
    .media-btn {
      flex: 1;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #aaa;
      font-size: 20px;
      cursor: pointer;
      padding: 10px;
      line-height: 1;
      text-align: center;
    }
    .media-btn:active { background: #2a2a2a; }
    .media-btn.play {
      font-size: 24px;
      color: #fff;
      background: #e31937;
      border-color: #e31937;
      flex: 1.4;
    }
    .media-btn.play:active { background: #a0112a; }

    /* ── NAV CARD ── */
    #nav-card { flex-shrink: 0; }
    #nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:active { background: #2a2a2a; }
    .nav-btn .nav-icon { font-size: 24px; line-height: 1; flex-shrink: 0; }

    /* ── APPS CARD ── */
    #apps-card { flex: 1; min-height: 0; }

    #fav-apps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    .fav-app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 6px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #ccc;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .fav-app-btn:active { background: #2a2a2a; }
    .fav-app-btn img {
      width: 34px; height: 34px;
      border-radius: 8px;
    }
    .fav-app-btn .app-emoji { font-size: 26px; line-height: 1; }
    .fav-app-btn span {
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; width: 100%; text-align: center;
    }

    #all-apps-btn {
      margin-top: 8px;
      width: 100%;
      padding: 10px;
      background: none;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #555;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }
    #all-apps-btn:active { background: #1e1e1e; color: #888; }

    /* ── ALL APPS OVERLAY ── */
    #all-apps-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      z-index: 100;
      flex-direction: column;
      padding: 16px 20px 20px;
    }
    #all-apps-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    #all-apps-header h2 { font-size: 16px; font-weight: 600; color: #fff; }
    #all-apps-close {
      background: #1e1e1e; border: 1px solid #2a2a2a;
      color: #ccc; font-size: 13px; font-weight: 600;
      padding: 8px 18px; border-radius: 10px; cursor: pointer;
    }
    #all-apps-close:active { background: #2a2a2a; }

    #all-apps-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }
    #all-apps-grid::-webkit-scrollbar { display: none; }

    .all-app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 6px;
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 14px;
      color: #bbb;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
    }
    .all-app-btn:active { background: #2a2a2a; }
    .all-app-btn img { width: 36px; height: 36px; border-radius: 9px; }
    .all-app-btn span {
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; width: 100%; text-align: center;
    }
    .all-apps-loading {
      grid-column: 1 / -1;
      color: #444; font-size: 13px;
      text-align: center; padding: 40px 0;
    }

    /* ── BOTTOM BAR ── */
    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      height: 54px;
      background: #111;
      border-top: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    .slider-group { display: flex; align-items: center; gap: 8px; flex: 1; }
    .slider-icon { font-size: 13px; color: #555; flex-shrink: 0; }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; border-radius: 2px;
      background: #2a2a2a; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: #e31937; cursor: pointer;
    }
    #mirror-btn {
      padding: 0 22px; height: 36px;
      background: #e31937; border: none; border-radius: 10px;
      color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    #mirror-btn:active { background: #a0112a; }

    /* ── MIRROR SCREEN ── */
    #mirror-screen { display: none; position: fixed; inset: 0; background: #000; }
    #mirror-canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    #touch-overlay { position: fixed; inset: 0; touch-action: none; cursor: crosshair; z-index: 10; }

    #rotation-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 50;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      font-size: 14px; color: #666;
    }
    #rotation-overlay .spin { font-size: 32px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hud {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center; z-index: 20; pointer-events: none;
    }
    .hud-pill {
      padding: 5px 14px; border-radius: 20px;
      background: rgba(0,0,0,0.65); font-size: 12px;
      color: rgba(255,255,255,0.55); pointer-events: all;
    }
    #fps-label { pointer-events: none; }
    #back-btn, #disconnect-btn { cursor: pointer; }
    #disconnect-btn { color: #e31937; }

    .ripple {
      position: fixed; pointer-events: none; border-radius: 50%;
      background: rgba(255,255,255,0.35);
      animation: ripple-out 0.4s ease-out forwards; z-index: 30;
    }
    @keyframes ripple-out {
      from { width:0; height:0; opacity:1; margin:0; }
      to   { width:60px; height:60px; opacity:0; margin:-30px; }
    }
  </style>
</head>
<body ontouchstart="">

<!-- ── CONNECT ── -->
<div id="connect-screen">
  <h1>TeslaMirror</h1>
  <p class="subtitle">Enter the room code shown on your phone</p>
  <input id="room-input" type="text" maxlength="6" placeholder="ABC123"
         autocomplete="off" spellcheck="false" autocapitalize="characters">
  <button id="connect-btn" onclick="connect()">Connect</button>
  <p id="status"></p>
</div>

<!-- ── LAUNCHER ── -->
<div id="launcher-screen">

  <div id="top-bar">
    <div id="top-bar-brand">TESLAMIRROR</div>
    <div id="top-clock">--:--</div>
    <div id="top-bar-right"><div class="status-dot"></div>Connected</div>
  </div>

  <div id="launcher-grid">

    <!-- Left: Music -->
    <div id="left-col">
      <div class="card" id="music-card">
        <div class="card-label">Now Playing</div>
        <div id="music-body">
          <div id="music-art-wrap">
            <div id="music-art-placeholder">🎵</div>
            <img id="music-art-img" alt="Album art">
          </div>
          <div id="music-text">
            <div id="music-title">Music</div>
            <div id="music-artist">Play something on your phone</div>
          </div>
        </div>
        <div id="music-controls">
          <button class="media-btn" onclick="send({type:'media_prev'})">⏮</button>
          <button class="media-btn play" id="play-btn" onclick="togglePlay()">⏵</button>
          <button class="media-btn" onclick="send({type:'media_next'})">⏭</button>
        </div>
      </div>
    </div>

    <!-- Right: Nav + Apps -->
    <div id="right-col">

      <div class="card" id="nav-card">
        <div class="card-label">Navigation</div>
        <div id="nav-buttons">
          <button class="nav-btn" onclick="send({type:'launch_app',package:'com.waze'})">
            <span class="nav-icon">🗺️</span>Waze
          </button>
          <button class="nav-btn" onclick="send({type:'launch_app',package:'com.google.android.apps.maps'})">
            <span class="nav-icon">📍</span>Maps
          </button>
        </div>
      </div>

      <div class="card" id="apps-card">
        <div class="card-label">Apps</div>
        <div id="fav-apps-grid">
          <!-- Populated with first 8 apps from phone -->
        </div>
        <button id="all-apps-btn" onclick="openAllApps()">All Apps ›</button>
      </div>

    </div>
  </div>

  <div id="bottom-bar">
    <div class="slider-group">
      <span class="slider-icon">🔈</span>
      <input type="range" id="vol-slider" min="0" max="100" value="50"
             oninput="send({type:'set_volume',value:this.value/100})">
      <span class="slider-icon">🔊</span>
    </div>
    <div class="slider-group">
      <span class="slider-icon">🌑</span>
      <input type="range" id="bright-slider" min="0" max="100" value="80"
             oninput="send({type:'set_brightness',value:this.value/100})">
      <span class="slider-icon">☀️</span>
    </div>
    <button id="mirror-btn" onclick="showMirror()">📲 Mirror</button>
  </div>

</div>

<!-- ── ALL APPS OVERLAY ── -->
<div id="all-apps-overlay">
  <div id="all-apps-header">
    <h2>All Apps</h2>
    <button id="all-apps-close" onclick="closeAllApps()">✕ Close</button>
  </div>
  <div id="all-apps-grid">
    <div class="all-apps-loading">Loading…</div>
  </div>
</div>

<!-- ── MIRROR ── -->
<div id="mirror-screen">
  <canvas id="mirror-canvas"></canvas>
  <div id="touch-overlay"></div>
  <div id="rotation-overlay">
    <div class="spin">🔄</div>Rotating…
  </div>
  <div id="hud">
    <span class="hud-pill" id="fps-label">-- fps</span>
    <span class="hud-pill" id="back-btn" onclick="showLauncher()">← Launcher</span>
    <span class="hud-pill" id="disconnect-btn" onclick="disconnect()">✕ Disconnect</span>
  </div>
</div>

<script>
  const SERVER_WS = location.origin.replace(/^http/, 'ws');
  const canvas    = document.getElementById('mirror-canvas');
  const ctx       = canvas.getContext('2d');
  const overlay   = document.getElementById('touch-overlay');
  const fpsLabel  = document.getElementById('fps-label');
  const statusEl  = document.getElementById('status');
  const rotOvl    = document.getElementById('rotation-overlay');

  let ws        = null;
  let frameCount = 0;
  let playing    = false;
  let allApps    = [];  // full list cached from phone

  // Sequential frame decode — prevents race condition on rotation
  let decoding = false;
  let nextBlob = null;

  function scheduleFrame(blob) {
    nextBlob = blob;
    if (!decoding) decodeNext();
  }

  async function decodeNext() {
    if (!nextBlob) { decoding = false; return; }
    decoding = true;
    const blob = nextBlob;
    nextBlob = null;
    try {
      const bmp = await createImageBitmap(blob);
      if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
        canvas.width  = bmp.width;
        canvas.height = bmp.height;
        fitCanvas();
      }
      ctx.drawImage(bmp, 0, 0);
      bmp.close();
      frameCount++;
    } catch(e) {}
    decodeNext();
  }

  // Clock
  function updateClock() {
    const d = new Date();
    document.getElementById('top-clock').textContent =
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 10000);

  // FPS
  setInterval(() => { fpsLabel.textContent = frameCount + ' fps'; frameCount = 0; }, 1000);

  // Auto-fill room code
  window.addEventListener('DOMContentLoaded', () => {
    const room = new URLSearchParams(location.search).get('room');
    if (room) document.getElementById('room-input').value = room.toUpperCase();
  });

  function setStatus(msg, color='#555') {
    statusEl.textContent = msg; statusEl.style.color = color;
  }

  // ── WebSocket ──
  function connect() {
    const roomCode = document.getElementById('room-input').value.trim().toUpperCase();
    if (roomCode.length < 4) { setStatus('Enter a valid room code','#e31937'); return; }
    setStatus('Connecting…','#888');
    ws = new WebSocket(SERVER_WS);
    ws.binaryType = 'blob';

    ws.onopen = () => {
      ws.send(JSON.stringify({ type:'join', room:roomCode, role:'browser' }));
      setStatus('Waiting for phone…','#f5a623');
    };

    ws.onmessage = (event) => {
      if (event.data instanceof Blob) { scheduleFrame(event.data); return; }
      const msg = JSON.parse(event.data);

      switch (msg.type) {
        case 'peer_ready':
          showLauncher();
          setupTouchHandlers();
          send({ type: 'get_apps' });
          break;
        case 'peer_disconnected':
          showConnect('Phone disconnected');
          break;
        case 'initial_state':
          document.getElementById('vol-slider').value    = Math.round(msg.volume * 100);
          document.getElementById('bright-slider').value = Math.round(msg.brightness * 100);
          break;
        case 'volume_update':
          document.getElementById('vol-slider').value = Math.round(msg.value * 100);
          break;
        case 'app_list':
          allApps = msg.apps;
          renderFavApps(allApps.slice(0, 8));
          renderAllAppsGrid(allApps);
          break;
        case 'media_info':
          updateMediaInfo(msg);
          break;
        case 'stream_pause':
          rotOvl.style.display = 'flex';
          break;
        case 'stream_resume':
          if (msg.width && msg.height) {
            canvas.width  = msg.width;
            canvas.height = msg.height;
            fitCanvas();
          }
          rotOvl.style.display = 'none';
          break;
      }
    };

    ws.onclose = () => showConnect('Disconnected');
    ws.onerror = () => setStatus('Connection error','#e31937');
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }
  function disconnect() { ws && ws.close(); }

  function togglePlay() {
    playing = !playing;
    document.getElementById('play-btn').textContent = playing ? '⏸' : '⏵';
    send({ type: 'media_play_pause' });
  }

  // ── Media info ──
  function updateMediaInfo(msg) {
    if (msg.title)  document.getElementById('music-title').textContent  = msg.title;
    if (msg.artist !== undefined) document.getElementById('music-artist').textContent = msg.artist || '—';
    const img = document.getElementById('music-art-img');
    const ph  = document.getElementById('music-art-placeholder');
    if (msg.art) {
      img.src = 'data:image/jpeg;base64,' + msg.art;
      img.style.display = 'block';
      ph.style.display  = 'none';
    } else {
      img.style.display = 'none';
      ph.style.display  = 'flex';
    }
  }

  // ── Favorite apps (first 8 from loaded list) ──
  function renderFavApps(apps) {
    const grid = document.getElementById('fav-apps-grid');
    grid.innerHTML = '';
    apps.forEach(app => {
      const btn = document.createElement('button');
      btn.className = 'fav-app-btn';
      btn.innerHTML =
        '<img src="data:image/png;base64,' + app.icon + '" alt="">' +
        '<span>' + escHtml(app.name) + '</span>';
      btn.onclick = () => send({ type:'launch_app', package:app.package });
      grid.appendChild(btn);
    });
  }

  // ── All apps overlay ──
  function openAllApps() {
    document.getElementById('all-apps-overlay').style.display = 'flex';
    if (allApps.length === 0) send({ type: 'get_apps' });
  }
  function closeAllApps() {
    document.getElementById('all-apps-overlay').style.display = 'none';
  }
  function renderAllAppsGrid(apps) {
    const grid = document.getElementById('all-apps-grid');
    grid.innerHTML = '';
    apps.forEach(app => {
      const btn = document.createElement('button');
      btn.className = 'all-app-btn';
      btn.innerHTML =
        '<img src="data:image/png;base64,' + app.icon + '" alt="">' +
        '<span>' + escHtml(app.name) + '</span>';
      btn.onclick = () => { send({ type:'launch_app', package:app.package }); closeAllApps(); };
      grid.appendChild(btn);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Transitions ──
  function showConnect(msg) {
    document.getElementById('connect-screen').style.display  = 'flex';
    document.getElementById('launcher-screen').style.display = 'none';
    document.getElementById('mirror-screen').style.display   = 'none';
    if (msg) setStatus(msg);
  }
  function showLauncher() {
    document.getElementById('connect-screen').style.display  = 'none';
    document.getElementById('launcher-screen').style.display = 'flex';
    document.getElementById('mirror-screen').style.display   = 'none';
  }
  function showMirror() {
    document.getElementById('launcher-screen').style.display = 'none';
    document.getElementById('mirror-screen').style.display   = 'block';
    fitCanvas();
  }

  // ── Canvas fit ──
  function fitCanvas() {
    if (!canvas.width || !canvas.height) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const ia = canvas.width / canvas.height, sa = vw / vh;
    let w, h;
    if (ia > sa) { w = vw; h = vw / ia; }
    else          { h = vh; w = vh * ia; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);

  // ── Touch / swipe ──
  function getCanvasCoords(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(1, (cx - r.left) / r.width)),
      y: Math.max(0, Math.min(1, (cy - r.top)  / r.height))
    };
  }
  function spawnRipple(cx, cy) {
    const el = document.createElement('div');
    el.className = 'ripple';
    el.style.left = cx + 'px'; el.style.top = cy + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
  function setupTouchHandlers() {
    let sx, sy;
    overlay.addEventListener('touchstart', e => {
      e.preventDefault();
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive:false });
    overlay.addEventListener('touchend', e => {
      e.preventDefault();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const t = e.changedTouches[0];
      const dist = Math.hypot(t.clientX - sx, t.clientY - sy);
      if (dist < 12) {
        spawnRipple(t.clientX, t.clientY);
        const c = getCanvasCoords(t.clientX, t.clientY);
        ws.send(JSON.stringify({ type:'touch', action:'tap', x:c.x, y:c.y }));
      } else {
        const s = getCanvasCoords(sx, sy), en = getCanvasCoords(t.clientX, t.clientY);
        ws.send(JSON.stringify({ type:'swipe', x1:s.x, y1:s.y, x2:en.x, y2:en.y }));
      }
    }, { passive:false });
    overlay.addEventListener('click', e => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      spawnRipple(e.clientX, e.clientY);
      const c = getCanvasCoords(e.clientX, e.clientY);
      ws.send(JSON.stringify({ type:'touch', action:'tap', x:c.x, y:c.y }));
    });
  }
</script>
</body>
